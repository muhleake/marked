name: Marked
options:
  bundleIdPrefix: io.github.muhleake
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

packages:
  swift-cmark:
    url: https://github.com/apple/swift-cmark
    revision: a7ecfef490df1b17927ea828bc2a73cc0b69990d  # gfm branch

targets:
  Marked:
    type: application
    platform: macOS
    sources:
      - path: Marked
        excludes:
          - Info.plist
          - Marked.entitlements
    dependencies:
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhleake.marked
        PRODUCT_NAME: Marked
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_ENTITLEMENTS: Marked/Marked.entitlements
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_FILE: Marked/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Marked/Info.plist
      properties:
        CFBundleName: Marked
        CFBundleDisplayName: Marked
        CFBundleIconFile: AppIcon
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 muhleake. MIT License."
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown, io.github.muhleake.marked.mdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeReferenceURL: https://daringfireball.net/projects/markdown/
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown]
              public.mime-type: [text/markdown]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.muhleake.marked.mdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [net.daringfireball.markdown, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [mdown]

  MarkedTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MarkedTests]
    dependencies:
      - target: Marked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhleake.markedtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Marked.app/Contents/MacOS/Marked
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Marked:
    build:
      targets:
        Marked: all
        MarkedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MarkedTests]
      commandLineArguments:
        "-ApplePersistenceIgnoreState YES": true
    archive:
      config: Release
